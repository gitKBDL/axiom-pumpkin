name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          rustup update stable && rustup default stable
          rustup target add wasm32-wasip2
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --target wasm32-wasip2 --release -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --locked --target wasm32-wasip2 --release
          cp target/wasm32-wasip2/release/axiom_pumpkin.wasm axiom.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: axiom
          path: axiom.wasm

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: axiom.wasm
          body: |
            Put `axiom.wasm` in the server's `plugins/` folder.

            The plugin needs the [Pumpkin for Axiom](https://github.com/gitKBDL/Pumpkin-Core/releases) server until its plugin API additions are merged upstream. Players need Minecraft 26.3 with Axiom 6.1 or newer.
