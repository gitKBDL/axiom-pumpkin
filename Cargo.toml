[package]
name = "axiom-pumpkin"
version = "0.1.0"
edition = "2024"
description = "Serverside component for Axiom on PumpkinMC"
license = "MIT"
repository = "https://github.com/gitKBDL/axiom-pumpkin"

# Standalone: do not get adopted into a parent workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin API additions this needs live on the axiom branch of this fork
# until they are merged upstream. The tag is the server release to pair with.
pumpkin-plugin-api = { git = "https://github.com/gitKBDL/Pumpkin-Core", tag = "axiom-v0.1.0" }
# Pure-Rust zstd decoder. The C `zstd` crate would need a wasi-sdk C toolchain;
# we only ever decompress inbound frames, and reply uncompressed.
ruzstd = "0.7"
getrandom = "0.3"
# Forwarded to the server console by the plugin API's tracing subscriber.
tracing = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
